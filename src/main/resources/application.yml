spring:
  application:
    name: network-monitoring-dashboard

  datasource:
    url: jdbc:sqlite:/app/data/monitoring.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: 8080

monitoring:
  interval: 10000
  timeout: 2s
  ping-interval: 30000
  ping-timeout: 1000
  history-retention: 30d

  devices:
    - id: app
      name: Monitoring Application
      host: app
      port: 8080
      enabled: true

    - id: prometheus
      name: Prometheus
      host: prometheus
      port: 9090
      enabled: true

    - id: grafana
      name: Grafana
      host: grafana
      port: 3000
      enabled: true

    - id: demo
      name: Demo Service
      host: demo-service
      port: 80
      enabled: true

    - id: lan-router
      name: LAN Router
      host: 10.30.0.1  # Replace with your LAN router's IP address，route -n get default
      port: 443
      enabled: true

    - id: vpn-endpoint
      name: VPN Endpoint
      host: 134.96.208.36
      port: 53
      enabled: true

#    - id: test-router
#      name: Test-Router
#      host: 192.0.2.1
#      port: 443
#      enabled: true

    - id: test-switch
      name: Test-Switch
      host: host.docker.internal
      port: 59999
      enabled: true

#    - id: test-firewall
#      name: Test-Firewall
#      host: 192.0.2.3
#      port: 443
#      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}