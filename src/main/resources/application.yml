spring:
  application:
    name: network-monitoring-dashboard

  datasource:
    url: jdbc:sqlite:/app/data/monitoring.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: 8080

monitoring:
  interval: 15000
  timeout: 2s

  devices:
    - name: Monitoring Application
      host: app
      port: 8080
      enabled: true

    - name: Prometheus
      host: prometheus
      port: 9090
      enabled: true

    - name: Grafana
      host: grafana
      port: 3000
      enabled: true

    - name: Demo Service
      host: grafana
      port: 3000
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}