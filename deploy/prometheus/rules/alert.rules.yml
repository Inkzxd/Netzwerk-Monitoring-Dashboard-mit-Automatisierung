groups:
  - name: network-monitoring.rules
    rules:
      - alert: NetworkDeviceDown
        expr: network_device_up{device!=""} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "Network device is down"
          description: "Device {{ $labels.device }} at {{ $labels.host }} is unreachable."

      - alert: HighNetworkLatency
        expr: network_device_latency_ms{device!=""} > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Network latency is too high"
          description: "Device {{ $labels.device }} at {{ $labels.host }} has latency of {{ $value }} ms."

      - alert: MonitoringMetricsMissing
        expr: absent(up{job="spring-boot-app"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring application metrics are missing"
          description: "Prometheus cannot find metrics from the Spring Boot monitoring application."

      - alert: SpringBootAppDown
        expr: up{job="spring-boot-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spring Boot application is down"
          description: "Prometheus cannot scrape the Spring Boot monitoring application."