global:
  scrape_interval: 10s

scrape_configs:
  - job_name: spring-boot-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

rule_files:
  - /etc/prometheus/rules/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093